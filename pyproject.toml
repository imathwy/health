[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-healthlog"
version = "0.1.0"
description = "Local-first Apple Photos diet logging and static reports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diet = "healthlog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
